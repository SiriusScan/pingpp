name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GOWORK: 'off'

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.24"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify published Go module
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          go mod init example.com/pingpp-smoke
          go get "github.com/SiriusScan/pingpp/pkg/runner@$GITHUB_SHA"
          go mod download -json github.com/SiriusScan/pingpp
          cat >main.go <<'EOF'
          package main

          import "github.com/SiriusScan/pingpp/pkg/runner"

          func main() {
              _ = runner.DefaultOptions()
          }
          EOF
          go build -mod=readonly .

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -race

      - name: Test Coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
